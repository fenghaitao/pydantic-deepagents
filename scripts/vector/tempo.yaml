# Grafana Tempo — single-binary all-in-one config (no distributed components)
# Port env vars (set by observability.sh from Discovery Server or defaults):
#   TEMPO_HTTP_PORT         — HTTP query API / Grafana datasource (default: 3200)
#   TEMPO_INTERNAL_GRPC_PORT — Tempo internal gRPC (default: 9095)
#   TEMPO_OTLP_GRPC_PORT    — OTLP gRPC ingest (default: 4317)
#   TEMPO_OTLP_HTTP_PORT    — OTLP HTTP ingest (default: 4318)
stream_over_http_enabled: true

server:
  http_listen_port: ${TEMPO_HTTP_PORT}
  grpc_listen_port: ${TEMPO_INTERNAL_GRPC_PORT}
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:${TEMPO_OTLP_GRPC_PORT}"
        http:
          endpoint: "0.0.0.0:${TEMPO_OTLP_HTTP_PORT}"

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 100_000_000
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

querier: {}

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
  metrics:
    max_duration: 0s

# Metrics generator: enables TraceQL metrics (rate(), histogram()) used by
# the Grafana Traces Drilldown app and service graph panel.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://localhost:${VICTORIA_METRICS_PORT}/api/v1/write
        send_exemplars: true
  processor:
    local_blocks:
      max_live_traces: 50000
      complete_block_timeout: 3m
      filter_server_spans: false

overrides:
  metrics_generator_processors: [service-graphs, span-metrics, local-blocks]
