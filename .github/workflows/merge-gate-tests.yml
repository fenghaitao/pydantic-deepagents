name: Merge Gate Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel stale runs for the same PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150
  # uv uses a bundled Rust TLS stack that does not trust the system CA store by
  # default.  On Intel self-hosted runners the corporate proxy presents a cert
  # signed by the Intel Proxy Root CA, which causes "invalid peer certificate:
  # UnknownIssuer" errors.  UV_NATIVE_TLS=1 switches uv to OpenSSL, which
  # already has the Intel CA anchors in its trust store.
  UV_NATIVE_TLS: "1"
  # Node.js (used by npm / lerna / setup-uv action) also has a bundled CA store
  # and ignores the system store by default.  Setting NODE_EXTRA_CA_CERTS makes
  # every node process in every step trust the system bundle, which includes
  # the Intel Proxy Root CA — fixing "unable to get local issuer certificate"
  # errors in npm install / lerna bootstrap on fresh self-hosted runners.
  NODE_EXTRA_CA_CERTS: /etc/ssl/ca-bundle.pem
  # Python's requests/httpx (used by LiteLLM, huggingface_hub, etc.) has its
  # own bundled CA store and ignores NODE_EXTRA_CA_CERTS.  These two vars make
  # every Python HTTPS call in every step trust the Intel Proxy Root CA.
  SSL_CERT_FILE: /etc/ssl/ca-bundle.pem
  REQUESTS_CA_BUNDLE: /etc/ssl/ca-bundle.pem
  # Single source of truth for the Python version used across all jobs.
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # Run the full test suite via `make test`.
  # To add more fast checks to the merge gate, add new jobs below and list
  # them in the `needs:` of the `gate` job at the bottom.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-sync-args: "--frozen --group dev --group lint"

      - name: Verify uv.lock is consistent
        run: make uv-lock-check

      - name: Run tests
        env:
          # Emit JUnit XML alongside coverage so the AI RCA step has structured
          # failure data to work with even for the plain `make test` invocation.
          PYTEST_ADDOPTS: "--junitxml=test-results/junit-unit.xml"
        run: |
          mkdir -p test-results
          make test

      - name: Generate lcov report
        run: uv run --no-sync coverage lcov -o coverage.lcov

      - name: AI Root Cause Analysis
        if: failure()
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PR_COMMENT_FLAG: ${{ github.event_name == 'pull_request' && '--pr-comment' || '' }}
        run: |
          uv run --no-sync python tools/ci_rca/root_cause_analysis.py \
            --junit-dir test-results \
            --output test-results/ai-root-cause-analysis.md \
            ${PR_COMMENT_FLAG} \
          || echo "WARNING: AI RCA failed, continuing CI safely"

      - name: Upload RCA report
        if: failure()
        run: |
          if [ -f test-results/ai-root-cause-analysis.md ]; then
            echo "## 🤖 AI Root Cause Analysis" >> "$GITHUB_STEP_SUMMARY"
            cat test-results/ai-root-cause-analysis.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Gate: every submodule whose pointer was updated in this PR/push must be
  # pinned to the current HEAD of its remote main branch.  This enforces the
  # policy that submodule changes are merged upstream BEFORE this repo is
  # updated to reference them.
  # ---------------------------------------------------------------------------
  check-submodule-shas:
    name: Check / Submodule SHAs match remote main HEAD
    runs-on: self-hosted
    steps:
      - name: Checkout parent repo (no submodule clone needed)
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Validate updated submodule SHAs match remote main HEAD
        run: |
          set -euo pipefail

          # Determine the base commit to diff against.
          # For pull_request events use the PR base SHA; for push events use the
          # previous commit SHA (github.event.before).  Either way, with
          # fetch-depth: 0 the commit is always present locally.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # Read submodule paths and URLs directly from .gitmodules so this
          # step stays correct automatically when submodules are added/removed.
          FAILED=0

          while IFS= read -r entry; do
            NAME="${entry%%=*}"
            SUBMODULE_PATH="${entry#*=}"
            URL=$(git config -f .gitmodules "submodule.${NAME}.url")

            # Check whether this submodule pointer was touched in this PR/push.
            CHANGED=""
            if [ -n "${BASE_SHA}" ] && \
               [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && \
               git cat-file -t "${BASE_SHA}" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "${BASE_SHA}" HEAD \
                -- "${SUBMODULE_PATH}" || true)
            fi

            if [ -z "${CHANGED}" ]; then
              echo "SKIP  ${SUBMODULE_PATH} — pointer not changed in this PR/push."
              continue
            fi

            echo "CHECK ${SUBMODULE_PATH} — validating SHA against remote main..."

            SUBMODULE_SHA=$(git ls-tree HEAD "${SUBMODULE_PATH}" | awk '{print $3}')
            REMOTE_SHA=$(git ls-remote "${URL}" refs/heads/main | awk '{print $1}')

            echo "  Committed SHA : ${SUBMODULE_SHA}"
            echo "  Remote HEAD   : ${REMOTE_SHA}"

            if [ -z "${REMOTE_SHA}" ]; then
              echo "  ERROR: Could not retrieve the latest SHA from ${URL}."
              FAILED=1
              continue
            fi

            if [ "${SUBMODULE_SHA}" != "${REMOTE_SHA}" ]; then
              echo ""
              echo "  ERROR: ${SUBMODULE_PATH} is not pinned to the current HEAD of remote main."
              echo "  Merge your changes into the submodule's main branch first, then update:"
              echo "    git submodule update --remote ${SUBMODULE_PATH}"
              echo "    git add ${SUBMODULE_PATH}"
              echo "    git commit -m 'chore: update ${SUBMODULE_PATH} submodule to latest main'"
              FAILED=1
            else
              echo "  OK"
            fi
          done < <(git config -f .gitmodules --get-regexp 'submodule\..*\.path' \
                   | awk '{sub(/^submodule\./, "", $1); sub(/\.path$/, "", $1); print $1"="$2}')

          if [ "${FAILED}" -ne 0 ]; then
            echo ""
            echo "One or more submodules are not pinned to the current HEAD of their remote main branch."
            exit 1
          fi

          echo "All updated submodules are pinned to the current HEAD of their remote main branch."
