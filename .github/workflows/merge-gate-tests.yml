name: Merge Gate Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel stale runs for the same PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150

jobs:
  # ---------------------------------------------------------------------------
  # Run the full test suite via `make test`.
  # To add more fast checks to the merge gate, add new jobs below and list
  # them in the `needs:` of the `gate` job at the bottom.
  # ---------------------------------------------------------------------------
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: "--all-groups"

      - name: Run tests
        run: make test

      - name: Generate lcov report
        run: uv run coverage lcov -o coverage.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ matrix.python-version }}
          path: coverage.lcov
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Potpie submodule tests — copied from potpie/.github/workflows/unit-tests.yml
  # All `run:` steps execute inside the potpie/ submodule directory.
  # ---------------------------------------------------------------------------
  potpie-unit-tests:
    name: Potpie / Run unit tests (Python ${{ matrix.python-version }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_LINK_MODE: copy
      PYDANTIC_DEEP_LOGFIRE: ${{ vars.CI_LOGFIRE_ENABLED }}
      PYDANTIC_DEEP_LOG_LEVEL: ${{ vars.CI_LOGFIRE_LEVEL }}
      CI_LOGFIRE_ENABLED: ${{ vars.CI_LOGFIRE_ENABLED }}
      CI_LOGFIRE_BACKUP_PATH: ${{ vars.CI_LOGFIRE_BACKUP_PATH }}

    steps:
      - name: Stop backend before clean checkout
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f code-graph-providers/potpie/Makefile ]; then
            make potpie-stop-force 2>/dev/null || true
          fi
          pkill -f "${GITHUB_WORKSPACE}/code-graph-providers/potpie/.venv/bin/gunicorn" 2>/dev/null || true
          pkill -f "${GITHUB_WORKSPACE}/code-graph-providers/potpie/.venv/bin/celery"   2>/dev/null || true
          rm -rf code-graph-providers/potpie/singularity/singularity-compose/.venv
          rm -rf code-graph-providers/potpie/singularity/potpie-data
          sleep 3

      - name: Checkout code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Clear logfire sessions
        if: env.CI_LOGFIRE_ENABLED == 'true'
        working-directory: code-graph-providers/potpie
        run: |
          rm -rf .pydantic-deep/sessions
          mkdir -p .pydantic-deep/sessions
          echo "Logfire sessions directory cleared."

      - name: Prepare Python & venv (install dev extra -> pytest)
        working-directory: code-graph-providers/potpie
        run: |
          set -euo pipefail
          uv python install "${UV_PYTHON}"
          test -d .venv || uv venv --python "${UV_PYTHON}" .venv
          uv sync --group dev
          uv run python -V
          uv run pytest --version
          cp .env.template .env
          mkdir -p test-results

      - name: Run tests/unit-tests
        working-directory: code-graph-providers/potpie
        run: |
          uv run pytest tests/unit-tests \
            -m "not integration" \
            -v \
            --tb=short \
            --noconftest \
            --junitxml=test-results/junit-tests.xml
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ENABLE_MULTI_AGENT: "false"

      - name: Login to Docker Hub (reduce Singularity pull rate-limit exposure)
        working-directory: code-graph-providers/potpie
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | singularity remote login \
            --username "${{ secrets.DOCKER_HUB_USERNAME }}" \
            --password-stdin docker://docker.io 2>/dev/null || true

      - name: Ensure backend services are healthy
        working-directory: code-graph-providers/potpie
        run: make ensure-healthy HEALTH_FLAGS="--phoenix"

      - name: Run scip_dml integration test
        working-directory: code-graph-providers/potpie
        run: |
          eval "$(make --no-print-directory export-ports)"
          echo "Integration test ports — postgres: ${POSTGRES_PORT}, redis: ${REDIS_PORT}, neo4j_bolt: ${BOLT_PORT}, api: ${API_PORT}"

          echo "Verifying API health before test..."
          for _i in $(seq 1 15); do
            curl -sf "http://127.0.0.1:${API_PORT}/health" >/dev/null 2>&1 && break
            echo "  API not ready yet (attempt ${_i}/15) — waiting 4s..."
            sleep 4
          done
          curl -sf "http://127.0.0.1:${API_PORT}/health" || {
            echo "ERROR: API at port ${API_PORT} is not healthy after 60s. Cannot run integration tests."
            exit 1
          }
          echo "API is healthy."

          export PATH="$HOME/.cargo/bin:$PATH"
          make build-dls
          (cd tests/integration-tests/scip-dml/simics-project && \
            /nfs/site/disks/ssg_stc_simics_base-packages-release/simics-7/1000/7.79.0/bin/project-setup \
            --ignore-existing-files .)
          uv run pytest tests/integration-tests/scip-dml/test_scip_dml.py \
            -v -s \
            --tb=short \
            --junitxml=test-results/junit-int-scip-dml.xml

      - name: Run scip-python tests
        working-directory: code-graph-providers/potpie
        run: |
          uv run pytest tests/integration-tests/scip-python/test_scip_python.py \
            -v -s \
            --tb=short \
            --junitxml=test-results/junit-int-scip-python.xml

      - name: Run phoenix integration test
        working-directory: code-graph-providers/potpie
        run: |
          PHOENIX_PORT=$(uv run python -c "from ports_allocator import PortManager; p=PortManager().get('phoenix',workspace='${PWD}'); print(p) if p is not None else exit('phoenix not allocated')")
          if [ -z "$PHOENIX_PORT" ]; then
            echo "ERROR: Phoenix port not found. Ensure the backend was started with Phoenix support."
            exit 1
          fi

          echo "Checking Phoenix on port ${PHOENIX_PORT}..."
          for _i in $(seq 1 10); do
            curl -sf "http://127.0.0.1:${PHOENIX_PORT}/" >/dev/null 2>&1 && break
            echo "  Phoenix not ready yet (attempt ${_i}/10) — waiting 3s..."
            sleep 3
          done
          curl -sf "http://127.0.0.1:${PHOENIX_PORT}/" >/dev/null 2>&1 || {
            echo "ERROR: Phoenix is not responding on port ${PHOENIX_PORT} after 30s."
            exit 1
          }
          echo "Phoenix is healthy on port ${PHOENIX_PORT}."

          # uv run pytest tests/integration-tests/test_phoenix.py \
          #   -v -s \
          #   --tb=short \
          #   --junitxml=test-results/junit-int-phoenix.xml

      - name: Backup logfire sessions
        if: always()
        working-directory: code-graph-providers/potpie
        run: make backup-logfire

      - name: Clean up potpie-data
        if: always()
        working-directory: code-graph-providers/potpie
        run: |
          make stop-force 2>/dev/null || true
          rm -rf singularity/code-graph-providers/potpie-data

  # ---------------------------------------------------------------------------
  # Gate: the committed potpie submodule SHA must equal the current HEAD of
  # the remote main branch.  This enforces the policy that potpie changes are
  # merged into potpie/main BEFORE this repo is updated to reference them.
  # ---------------------------------------------------------------------------
  check-potpie-submodule-sha:
    name: Check / Potpie submodule SHA matches remote main HEAD
    runs-on: self-hosted
    steps:
      - name: Checkout parent repo (no submodule clone needed)
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Validate potpie submodule SHA matches remote main HEAD
        run: |
          set -euo pipefail

          # Determine the base commit to diff against.
          # For pull_request events use the PR base SHA; for push events use the
          # previous commit SHA (github.event.before).  Either way, with
          # fetch-depth: 0 the commit is always present locally.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # If the submodule path was not touched in this PR/push, skip the
          # remote-tip check — there is nothing new to validate.
          SUBMODULE_CHANGED=""
          if [ -n "${BASE_SHA}" ] && \
             [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -t "${BASE_SHA}" >/dev/null 2>&1; then
            SUBMODULE_CHANGED=$(git diff --name-only "${BASE_SHA}" HEAD \
              -- code-graph-providers/potpie || true)
          fi

          if [ -z "${SUBMODULE_CHANGED}" ]; then
            echo "Potpie submodule SHA was not changed in this PR/push — skipping SHA validation."
            exit 0
          fi

          echo "Potpie submodule was updated — validating SHA against remote main..."

          # Read the committed submodule SHA directly from the git tree object.
          # This is cleaner than `git submodule status` which requires submodule
          # state and emits status-prefix characters (+, -, U) that need stripping.
          SUBMODULE_SHA=$(git ls-tree HEAD code-graph-providers/potpie | awk '{print $3}')
          REMOTE_SHA=$(git ls-remote https://github.com/intel-sandbox/potpie \
            refs/heads/main | awk '{print $1}')

          echo "Committed submodule SHA : ${SUBMODULE_SHA}"
          echo "Remote main HEAD        : ${REMOTE_SHA}"

          if [ -z "${REMOTE_SHA}" ]; then
            echo "ERROR: Could not retrieve the latest SHA from the remote repository."
            exit 1
          fi

          if [ "${SUBMODULE_SHA}" != "${REMOTE_SHA}" ]; then
            echo ""
            echo "ERROR: The potpie submodule is not pinned to the current HEAD of remote main."
            echo "Merge your potpie changes into potpie/main first, then update this repo:"
            echo "  git submodule update --remote code-graph-providers/potpie"
            echo "  git add code-graph-providers/potpie"
            echo "  git commit -m 'chore: update potpie submodule to latest main'"
            exit 1
          fi

          echo "OK: potpie submodule SHA matches the current HEAD of remote main."
