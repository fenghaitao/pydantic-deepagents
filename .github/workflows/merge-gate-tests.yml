name: Merge Gate Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel stale runs for the same PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150
  # uv uses a bundled Rust TLS stack that does not trust the system CA store by
  # default.  On Intel self-hosted runners the corporate proxy presents a cert
  # signed by the Intel Proxy Root CA, which causes "invalid peer certificate:
  # UnknownIssuer" errors.  UV_NATIVE_TLS=1 switches uv to OpenSSL, which
  # already has the Intel CA anchors in its trust store.
  UV_NATIVE_TLS: "1"
  # Node.js (used by npm / lerna / setup-uv action) also has a bundled CA store
  # and ignores the system store by default.  Setting NODE_EXTRA_CA_CERTS makes
  # every node process in every step trust the system bundle, which includes
  # the Intel Proxy Root CA — fixing "unable to get local issuer certificate"
  # errors in npm install / lerna bootstrap on fresh self-hosted runners.
  NODE_EXTRA_CA_CERTS: /etc/ssl/ca-bundle.pem

jobs:
  # ---------------------------------------------------------------------------
  # Run the full test suite via `make test`.
  # To add more fast checks to the merge gate, add new jobs below and list
  # them in the `needs:` of the `gate` job at the bottom.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          uv-sync-args: "--frozen --group dev --group lint"

      - name: Verify uv.lock is consistent
        run: make uv-lock-check

      - name: Run tests
        run: make test

      - name: Generate lcov report
        run: uv run --no-sync coverage lcov -o coverage.lcov

  # ---------------------------------------------------------------------------
  # Potpie submodule tests — copied from potpie/.github/workflows/unit-tests.yml
  # All `run:` steps execute inside the potpie/ submodule directory.
  # ---------------------------------------------------------------------------
  potpie-integration-tests:
    name: Integration tests / Potpie
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]

    env:
      UV_PYTHON: "3.13"
      UV_LINK_MODE: copy
      # Explicitly set the cache dir so uv ignores XDG_CACHE_HOME (which may
      # point to a KDE temp dir on self-hosted runners, causing cache corruption).
      # /tmp is machine-local so different runners never share this path.
      UV_CACHE_DIR: /tmp/uv-cache
      UV_HTTP_TIMEOUT: 120
      # Skip dependency resolution for every `uv run` call (including inside
      # submodule scripts such as singularity/start.sh) — the lock file is the
      # source of truth and the restricted Intel mirror has no mistralai package.
      UV_FROZEN: "1"
      # Cache the HuggingFace sentence-transformers model in /tmp so it
      # persists across steps and avoids re-downloading on every job.
      HF_HOME: /tmp/hf-cache
      PYDANTIC_DEEP_LOGFIRE: ${{ vars.CI_LOGFIRE_ENABLED }}
      PYDANTIC_DEEP_LOG_LEVEL: ${{ vars.CI_LOGFIRE_LEVEL }}
      CI_LOGFIRE_ENABLED: ${{ vars.CI_LOGFIRE_ENABLED }}
      CI_LOGFIRE_BACKUP_PATH: ${{ vars.CI_LOGFIRE_BACKUP_PATH }}

    steps:
      - name: Stop backend before clean checkout
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f code-graph-providers/potpie/Makefile ]; then
            make potpie-stop-force 2>/dev/null || true
          fi
          pkill -f "${GITHUB_WORKSPACE}/code-graph-providers/potpie/.venv/bin/gunicorn" 2>/dev/null || true
          pkill -f "${GITHUB_WORKSPACE}/code-graph-providers/potpie/.venv/bin/celery"   2>/dev/null || true
          pkill -f "${GITHUB_WORKSPACE}/.venv/bin/phoenix"                              2>/dev/null || true
          rm -rf code-graph-providers/potpie/singularity/singularity-compose/.venv
          rm -rf code-graph-providers/potpie/singularity/potpie-data
          sleep 3

      - name: Checkout code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Clear logfire sessions
        if: env.CI_LOGFIRE_ENABLED == 'true'
        working-directory: code-graph-providers/potpie
        run: |
          rm -rf .pydantic-deep/sessions
          mkdir -p .pydantic-deep/sessions
          echo "Logfire sessions directory cleared."

      - name: Prepare Python & venv (install dev extra -> pytest)
        working-directory: code-graph-providers/potpie
        run: |
          set -euo pipefail
          uv python install "${UV_PYTHON}" || true
          test -d .venv || uv venv --python "${UV_PYTHON}" .venv
          uv sync --frozen --group dev
          uv run --no-sync python -V
          uv run --no-sync pytest --version
          cp .env.template .env
          mkdir -p test-results

      - name: Prepare pydantic-deepagents venv (for integration tests)
        run: |
          set -euo pipefail
          uv sync --frozen --python "${UV_PYTHON}" --all-groups --extra potpie --extra cgc

      - name: Run tests/unit-tests
        working-directory: code-graph-providers/potpie
        run: |
          uv run --no-sync pytest tests/unit-tests \
            -m "not integration" \
            -v \
            --tb=short \
            --noconftest \
            --junitxml=test-results/junit-tests.xml
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ENABLE_MULTI_AGENT: "false"

      - name: Login to Docker Hub (reduce Singularity pull rate-limit exposure)
        working-directory: code-graph-providers/potpie
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | singularity remote login \
            --username "${{ secrets.DOCKER_HUB_USERNAME }}" \
            --password-stdin docker://docker.io 2>/dev/null || true

      - name: Start Phoenix tracing server
        # Phoenix is managed at the pydantic-deepagents level — port allocated via
        # scripts/vector/alloc_ports.py, started via pydantic-deepagents .venv.
        # PHOENIX_PORT and PHOENIX_GRPC_PORT are written to GITHUB_ENV.
        run: bash scripts/phoenix.sh start

      - name: Pre-warm HuggingFace embedding model cache
        # The Celery parsing worker loads all-MiniLM-L6-v2 on first parse.
        # Downloading it here (before the backend starts) avoids a slow/throttled
        # download inside the worker which causes "Sub-job killed" panics in the
        # DML language server when the embedding step stalls.
        run: |
          uv run --no-sync python -c "
          from sentence_transformers import SentenceTransformer
          print('Pre-warming all-MiniLM-L6-v2 ...')
          SentenceTransformer('all-MiniLM-L6-v2', device='cpu')
          print('Model cached at \$HF_HOME.')
          "

      - name: Ensure backend services are healthy
        working-directory: code-graph-providers/potpie
        run: make ensure-healthy

      - name: Run scip_dml integration test
        # Runs from the pydantic-deepagents root.  make targets use -C to
        # operate on the potpie submodule without changing the shell cwd.
        # cargo build --release can take 20+ min on a cold cache; 60 min is safe.
        timeout-minutes: 60
        env:
          # Enable Rust-level logging so dfa/dls emit progress to stderr.
          # "info" gives stage markers without flooding the log; use "debug"
          # for deeper tracing if "info" is still insufficient.
          RUST_LOG: info
          # Print a full backtrace on any Rust panic (e.g. DLS sub-job kills).
          RUST_BACKTRACE: "1"
        run: |
          make -C code-graph-providers/potpie --no-print-directory export-ports > tmp-ports.env
          # shellcheck disable=SC1091  # file is generated at runtime
          source tmp-ports.env
          make -C code-graph-providers/potpie check-health HEALTH_FLAGS="--api-retries 15"

          export PATH="$HOME/.cargo/bin:$PATH"
          make -C code-graph-providers/potpie build-dls
          (cd code-graph-providers/potpie/tests/integration-tests/scip-dml/simics-project && \
            /nfs/site/disks/ssg_stc_simics_base-packages-release/simics-7/1000/7.79.0/bin/project-setup \
            --ignore-existing-files .)
          mkdir -p test-results
          uv run --no-sync pytest tests/integration-tests/test_scip_dml.py \
            -v -s \
            --tb=short \
            --junitxml=test-results/junit-int-scip-dml.xml

      - name: Run scip-python tests
        # Runs from the pydantic-deepagents root.
        # parse repo polls up to 120×5s=10min plus startup/LLM time; 30min is safe.
        timeout-minutes: 30
        run: |
          mkdir -p test-results
          uv run --no-sync pytest tests/integration-tests/test_scip_python.py \
            -v -s \
            --tb=short \
            --junitxml=test-results/junit-int-scip-python.xml

      - name: Run MCP integration tests
        timeout-minutes: 20
        run: |
          mkdir -p test-results
          uv run --no-sync pytest tests/integration-tests/test_mcp.py \
            -v -s \
            --tb=short \
            --junitxml=test-results/junit-int-mcp.xml

      - name: Check phoenix health
        run: bash scripts/phoenix.sh health 10

      - name: Run phoenix integration test
        # Runs from the pydantic-deepagents root — tests the pydantic-deep
        # --phoenix CLI flag.  PHOENIX_PORT is set in GITHUB_ENV by the
        # 'Start Phoenix tracing server' step above.
        run: |
          mkdir -p test-results
          uv run --no-sync pytest tests/integration-tests/test_phoenix.py \
            -v -s \
            --tb=short \
            --junitxml=test-results/junit-int-phoenix.xml

      - name: Backup logfire sessions
        if: always()
        working-directory: code-graph-providers/potpie
        run: make backup-logfire

      - name: Stop Phoenix tracing server
        if: always()
        run: bash scripts/phoenix.sh stop 2>/dev/null || true

      - name: Clean up potpie-data
        if: always()
        working-directory: code-graph-providers/potpie
        run: |
          make stop-force 2>/dev/null || true
          rm -rf singularity/potpie-data

  # ---------------------------------------------------------------------------
  # Observability stack tests — starts Vector/Tempo/VictoriaMetrics/VictoriaLogs
  # natively (no Docker), verifies service health, and runs smoke tests for the
  # --vector CLI feature.  Binaries are cached in scripts/vector/bin/ between
  # runs; only data/pids/logs are wiped each time.
  # ---------------------------------------------------------------------------
  observability-tests:
    name: Integration tests / Observability
    runs-on: self-hosted
    env:
      UV_LINK_MODE: copy

    steps:
      - name: Stop stale observability stack before clean checkout
        run: |
          # Graceful stop via script if present from a previous checkout.
          if [ -f scripts/vector/observability.sh ]; then
            bash scripts/vector/observability.sh stop 2>/dev/null || true
          fi
          # Kill any orphaned binaries that survived script removal.
          pkill -f "${GITHUB_WORKSPACE}/scripts/vector/bin/vector"                2>/dev/null || true
          pkill -f "${GITHUB_WORKSPACE}/scripts/vector/bin/victoria-metrics-prod" 2>/dev/null || true
          pkill -f "${GITHUB_WORKSPACE}/scripts/vector/bin/victoria-logs"         2>/dev/null || true
          pkill -f "${GITHUB_WORKSPACE}/scripts/vector/bin/tempo"                 2>/dev/null || true
          pkill -f "${GITHUB_WORKSPACE}/scripts/vector/bin/grafana"               2>/dev/null || true
          # Release any stale port allocations so the next run gets fresh ports.
          if [ -f .venv/bin/python ]; then
            .venv/bin/python scripts/vector/alloc_ports.py free 2>/dev/null || true
          fi
          # Wipe stale runtime dirs; leave scripts/vector/bin/ (cached binaries).
          rm -rf scripts/vector/data scripts/vector/pids scripts/vector/logs
          sleep 2

      - name: Checkout code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python & venv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          uv-sync-args: "--frozen --group dev --group lint"

      - name: Start observability stack
        run: bash scripts/vector/observability.sh start

      - name: Export allocated ports to GITHUB_ENV
        run: |
          # alloc_ports.py print emits VAR=VALUE lines; append each to GITHUB_ENV
          # so subsequent steps can reference them as shell variables.
          while IFS='=' read -r var val; do
            [[ -n "$var" ]] && echo "${var}=${val}" >> "$GITHUB_ENV"
          done < <(.venv/bin/python scripts/vector/alloc_ports.py print)

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          _check() {
            local name="$1" url="$2" retries="${3:-20}" interval="${4:-3}"
            echo "Checking ${name} at ${url} ..."
            for _i in $(seq 1 "$retries"); do
              curl -sf "$url" >/dev/null 2>&1 && echo "  OK: ${name}" && return 0
              echo "  ${name} not ready (attempt ${_i}/${retries}) — waiting ${interval}s..."
              sleep "$interval"
            done
            echo "ERROR: ${name} did not become healthy at ${url} after $((retries * interval))s"
            return 1
          }
          _check "VictoriaMetrics" "http://localhost:${VICTORIA_METRICS_PORT}/health"
          _check "VictoriaLogs"    "http://localhost:${VICTORIA_LOGS_PORT}/health"
          _check "Tempo"           "http://localhost:${TEMPO_HTTP_PORT}/ready"
          _check "Vector API"      "http://localhost:${VECTOR_API_PORT}/health"

      - name: Smoke test — log flow (Vector → VictoriaLogs)
        run: |
          set -euo pipefail
          # Unique tag so we can reliably find this specific entry.
          TEST_TAG="ci-obs-smoke-$$-${GITHUB_RUN_ID:-0}"

          echo "Posting test log to Vector HTTP ingest (port ${VECTOR_INGEST_PORT})..."
          curl -sf -X POST \
            "http://localhost:${VECTOR_INGEST_PORT}" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"observability smoke test\",\"service\":\"ci\",\"test_tag\":\"${TEST_TAG}\"}"
          echo "Log sent (test_tag=${TEST_TAG})"

          # Allow Vector to route and VictoriaLogs to index the record.
          sleep 4

          # Query VictoriaLogs for the test entry (stream-label filter on service).
          echo "Querying VictoriaLogs for test entry..."
          RESULT=$(curl -sf \
            "http://localhost:${VICTORIA_LOGS_PORT}/select/logsql/query?query=%7Bservice%3D%22ci%22%7D&limit=1&start=now-5m" \
            2>/dev/null || echo "")
          if [ -z "$RESULT" ]; then
            echo "ERROR: Log entry not found in VictoriaLogs after 4s."
            exit 1
          fi
          echo "Log confirmed in VictoriaLogs: ${RESULT}"

      - name: Smoke test — OTLP trace proxy reachable (Vector → Tempo)
        run: |
          # POST an empty body to Vector's OTLP HTTP proxy.  Tempo rejects it
          # with 400 (bad protobuf), but 000 = connection refused and means the
          # Vector → Tempo pipeline is broken.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "http://localhost:${VECTOR_OTLP_HTTP_PORT}/v1/traces" \
            -H "Content-Type: application/x-protobuf" \
            --data-binary "" || echo "000")
          echo "OTLP HTTP proxy response code: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "000" ]; then
            echo "ERROR: Vector OTLP proxy not reachable on port ${VECTOR_OTLP_HTTP_PORT}."
            exit 1
          fi
          echo "Vector OTLP proxy is reachable (code=${HTTP_CODE})."

      - name: Run observability unit tests
        run: |
          mkdir -p test-results
          # Collect any tests tagged with observability-related keywords.
          # pytest exits 5 when no tests match; treat that as success (placeholder
          # until dedicated observability test files are added).
          uv run --no-sync pytest tests/ \
            -k "vector or tempo or victoria or observab" \
            -v --tb=short \
            --ignore=code-graph-providers \
            --junitxml=test-results/junit-observability.xml \
          && PYTEST_EXIT=0 || PYTEST_EXIT=$?
          if [ "${PYTEST_EXIT}" -eq 5 ]; then
            echo "No observability-specific tests collected yet — OK (placeholder)."
            exit 0
          fi
          exit "${PYTEST_EXIT}"

      - name: Dump service logs on failure
        if: failure()
        run: |
          bash scripts/vector/observability.sh status 2>/dev/null || true
          for svc in vector tempo victoria-metrics victoria-logs; do
            echo "=== ${svc} log (last 50 lines) ==="
            tail -50 "scripts/vector/logs/${svc}.log" 2>/dev/null || echo "(no log file)"
          done

      - name: Stop observability stack
        if: always()
        run: |
          bash scripts/vector/observability.sh stop 2>/dev/null || true
          rm -rf scripts/vector/data scripts/vector/pids scripts/vector/logs

  # ---------------------------------------------------------------------------
  # Gate: every submodule whose pointer was updated in this PR/push must be
  # pinned to the current HEAD of its remote main branch.  This enforces the
  # policy that submodule changes are merged upstream BEFORE this repo is
  # updated to reference them.
  # ---------------------------------------------------------------------------
  check-submodule-shas:
    name: Check / Submodule SHAs match remote main HEAD
    runs-on: self-hosted
    steps:
      - name: Checkout parent repo (no submodule clone needed)
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Validate updated submodule SHAs match remote main HEAD
        run: |
          set -euo pipefail

          # Determine the base commit to diff against.
          # For pull_request events use the PR base SHA; for push events use the
          # previous commit SHA (github.event.before).  Either way, with
          # fetch-depth: 0 the commit is always present locally.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # Read submodule paths and URLs directly from .gitmodules so this
          # step stays correct automatically when submodules are added/removed.
          FAILED=0

          while IFS= read -r entry; do
            NAME="${entry%%=*}"
            SUBMODULE_PATH="${entry#*=}"
            URL=$(git config -f .gitmodules "submodule.${NAME}.url")

            # Check whether this submodule pointer was touched in this PR/push.
            CHANGED=""
            if [ -n "${BASE_SHA}" ] && \
               [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && \
               git cat-file -t "${BASE_SHA}" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "${BASE_SHA}" HEAD \
                -- "${SUBMODULE_PATH}" || true)
            fi

            if [ -z "${CHANGED}" ]; then
              echo "SKIP  ${SUBMODULE_PATH} — pointer not changed in this PR/push."
              continue
            fi

            echo "CHECK ${SUBMODULE_PATH} — validating SHA against remote main..."

            SUBMODULE_SHA=$(git ls-tree HEAD "${SUBMODULE_PATH}" | awk '{print $3}')
            REMOTE_SHA=$(git ls-remote "${URL}" refs/heads/main | awk '{print $1}')

            echo "  Committed SHA : ${SUBMODULE_SHA}"
            echo "  Remote HEAD   : ${REMOTE_SHA}"

            if [ -z "${REMOTE_SHA}" ]; then
              echo "  ERROR: Could not retrieve the latest SHA from ${URL}."
              FAILED=1
              continue
            fi

            if [ "${SUBMODULE_SHA}" != "${REMOTE_SHA}" ]; then
              echo ""
              echo "  ERROR: ${SUBMODULE_PATH} is not pinned to the current HEAD of remote main."
              echo "  Merge your changes into the submodule's main branch first, then update:"
              echo "    git submodule update --remote ${SUBMODULE_PATH}"
              echo "    git add ${SUBMODULE_PATH}"
              echo "    git commit -m 'chore: update ${SUBMODULE_PATH} submodule to latest main'"
              FAILED=1
            else
              echo "  OK"
            fi
          done < <(git config -f .gitmodules --get-regexp 'submodule\..*\.path' \
                   | awk '{sub(/^submodule\./, "", $1); sub(/\.path$/, "", $1); print $1"="$2}')

          if [ "${FAILED}" -ne 0 ]; then
            echo ""
            echo "One or more submodules are not pinned to the current HEAD of their remote main branch."
            exit 1
          fi

          echo "All updated submodules are pinned to the current HEAD of their remote main branch."

  # ---------------------------------------------------------------------------
  # scip-clang integration tests — indexes sample-cpp and simics-c++-device
  # with scip-clang and verifies that File, Class, and Repository nodes are
  # present in the resulting KuzuDB knowledge graphs.
  # ---------------------------------------------------------------------------
  scip-clang:
    name: Integration tests / scip-clang
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          uv-sync-args: "--frozen --group dev --extra cgc"

      - name: Download scip-clang binary
        run: make setup-scip-clang

      - name: Generate compile_commands.json for sample-cpp
        working-directory: tests/integration-tests/sample-cpp
        run: bash gen-compile-commands.sh

      - name: Run scip-clang / sample-cpp integration test
        run: |
          mkdir -p test-results
          uv run --no-sync pytest tests/integration-tests/test_scip_clang_sample_cpp.py \
            -v -s \
            --tb=short \
            --junitxml=test-results/junit-int-scip-clang-sample-cpp.xml

      - name: Set up Simics project scaffold
        working-directory: tests/integration-tests/simics-c++-device
        run: |
          /nfs/site/disks/ssg_stc_simics_base-packages-release/simics-7/1000/7.79.0/bin/project-setup \
            --ignore-existing-files .

      - name: Generate compile_commands.json for simics-c++-device
        working-directory: tests/integration-tests/simics-c++-device
        run: bash gen-compile-commands.sh

      - name: Run scip-clang / simics-c++-device integration test
        run: |
          mkdir -p test-results
          uv run --no-sync pytest tests/integration-tests/test_scip_clang_simics_device.py \
            -v -s \
            --tb=short \
            --junitxml=test-results/junit-int-scip-clang-simics-device.xml
