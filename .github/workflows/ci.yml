name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allow manual runs from the Actions tab with optional overrides.
  workflow_dispatch:
    inputs:
      python-version:
        description: "Single Python version to test (leave blank for full matrix)"
        required: false
        default: ""

# Cancel in-progress runs for the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150

jobs:
  lint:
    name: Lint / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: "--group lint"

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run ruff lint
        run: uv run ruff check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
          uv-sync-args: "--all-extras --group dev --group lint"

      - name: Run Pyright
        run: uv run pyright

      - name: Run MyPy
        run: uv run mypy pydantic_deep tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
          uv-sync-args: "--group lint"

      - name: Run Bandit security scanner
        run: uv run bandit -r pydantic_deep -x tests -ll

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
          uv-sync-args: "--group docs"

      - name: Build docs
        run: uv run mkdocs build

  # Gate job: merge only when every required check is green.
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, docs]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
