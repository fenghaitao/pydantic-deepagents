name: Publish to PyPI

on:
  # Automatic publishing is disabled. Run manually via workflow_dispatch when ready to publish.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1