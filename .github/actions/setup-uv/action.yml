name: Set up uv and Python
description: >
  Install uv (with caching), install the requested Python version, and sync
  project dependencies. `actions/checkout` must run before this action.

inputs:
  python-version:
    description: Python version to install (e.g. "3.13")
    required: false
    default: "3.13"
  uv-sync-args:
    description: Extra arguments forwarded verbatim to `uv sync`
    required: false
    default: "--locked --all-groups"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: auto

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      env:
        # Use OS-native TLS (OpenSSL) so uv trusts the system CA store,
        # which includes Intel's corporate proxy root CA on self-hosted runners.
        UV_NATIVE_TLS: "1"
      run: uv python install ${{ inputs.python-version }}

    - name: Install project dependencies
      shell: bash
      env:
        UV_NATIVE_TLS: "1"
      run: uv sync --python ${{ inputs.python-version }} ${{ inputs.uv-sync-args }}
